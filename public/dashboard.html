<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoldFlow - Dashboard</title>
  <script src="/vendor/tailwindcss.js"></script>
  <script src="/vendor/chart.min.js"></script>
  <script src="/vendor/jsbarcode.min.js"></script>
  <script src="/vendor/qrcode.min.js"></script>
  <script src="/vendor/html5-qrcode.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --primary: #1F2937;
      --secondary: #D4AF37;
      --bg: #F3F4F6;
      --card-bg: #FFFFFF;
      --text: #111827;
      --muted: #6B7280;
      --sidebar-width: 260px;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    .btn-gold {
      background-color: var(--secondary);
      color: #fff;
    }
    .btn-gold:hover { background-color: #B5952F; }
    .btn-outline { border: 1px solid #D1D5DB; }
    .btn-outline:hover { background-color: #F3F4F6; }
    
    /* Toast animations */
    .toast-enter { animation: slideIn 0.3s ease-out forwards; }
    @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

    /* Sleek luxury scrollbar for sidebarNav */
    #sidebarNav {
      scrollbar-width: thin;
      scrollbar-color: #3F3F46 transparent;
      scroll-behavior: smooth;
    }
    #sidebarNav::-webkit-scrollbar {
      width: 4px;
    }
    #sidebarNav::-webkit-scrollbar-track {
      background: transparent;
    }
    #sidebarNav::-webkit-scrollbar-thumb {
      background-color: #3F3F46;
      border-radius: 4px;
    }
    #sidebarNav::-webkit-scrollbar-thumb:hover {
      background-color: #D4AF37;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
    .hidden-override {
      display: none !important;
    }
    #sidebar.sidebar-is-collapsed .drag-handle {
      display: none !important;
    }
  </style>
</head>
<body class="flex h-screen w-full">

  <!-- Left Sidebar (Custom Sleek Dark Design matching Navbar Gallery) -->
  <aside id="sidebar" class="w-[250px] bg-[#1E1E22] border-r border-[#2C2C32] text-white flex flex-col fixed inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition-all duration-300 ease-in-out z-40 select-none shadow-2xl md:shadow-none">
    
    <!-- Top Header: Brand Name & Collapse / Expand Toggle Button -->
    <div class="h-14 flex items-center justify-between px-3.5 shrink-0">
      <div id="sidebarBrandContainer" class="flex items-center gap-2 overflow-hidden">
        <span class="text-[#D4AF37] text-lg font-black shrink-0">✦</span>
        <h1 class="text-sm font-bold text-gray-100 tracking-tight truncate font-sans" id="sidebarBrandName">GoldFlow</h1>
      </div>
      <button id="sidebarCollapseBtn" onclick="toggleSidebarCollapse()" class="w-8 h-8 rounded-lg bg-zinc-800/80 hover:bg-zinc-700 text-gray-400 hover:text-white flex items-center justify-center border border-zinc-700/60 transition shrink-0" title="Collapse Sidebar">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
          <path d="M15 15l-3-3 3-3"/>
        </svg>
      </button>
    </div>

    <!-- Dashed Separator Line (Exact Match to Screenshot) -->
    <div class="border-b border-dashed border-zinc-700/60 mx-3 my-0.5 shrink-0"></div>

    <!-- Scrollable Navigation Items -->
    <nav class="flex-1 overflow-y-auto px-2 py-2 space-y-1 no-scrollbar" id="sidebarNav">
      <!-- Nav items injected dynamically -->
    </nav>

    <!-- Dashed Separator Line Above Footer -->
    <div class="border-b border-dashed border-zinc-700/60 mx-3 my-0.5 shrink-0"></div>

    <!-- User Profile & Logout Footer -->
    <div class="p-2.5 shrink-0" id="sidebarFooter">
      <div class="flex items-center gap-2.5 p-1 rounded-xl hover:bg-zinc-800/40 transition" id="sidebarProfileContainer">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-amber-500 to-amber-700 text-white flex items-center justify-center text-xs font-black shrink-0 shadow" id="userInitial">U</div>
        <div class="flex-1 overflow-hidden" id="sidebarUserDetails">
          <div class="text-xs font-bold text-gray-200 truncate" id="userName">User Name</div>
          <div class="text-[10px] text-gray-400 truncate" id="userRole">Role</div>
        </div>
      </div>
      <button id="sidebarLogoutBtn" onclick="logout()" class="mt-2 w-full py-1.5 text-xs text-gray-400 hover:text-red-400 hover:bg-zinc-800/80 rounded-lg flex items-center justify-center gap-2 border border-zinc-700/40 transition font-semibold">
        <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span class="nav-label truncate">Logout</span>
      </button>
    </div>
  </aside>

  <!-- Mobile Overlay -->
  <div id="mobileOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-gray-900 bg-opacity-50 z-30 hidden md:hidden transition-opacity duration-300 opacity-0"></div>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col h-full overflow-hidden relative">
    
    <!-- Topbar -->
    <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 shrink-0">
      <div class="flex items-center gap-4">
        <button onclick="toggleSidebar()" class="md:hidden text-gray-600 hover:text-gray-900 focus:outline-none">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <h2 class="text-xl font-semibold text-gray-800" id="pageTitle">Dashboard</h2>
      </div>
      
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2">
          <div class="relative hidden sm:block">
            <input type="text" placeholder="Search..." class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm w-64 focus:ring-1 focus:ring-[#D4AF37] focus:border-[#D4AF37] outline-none" oninput="handleGlobalSearch(this.value)">
            <span class="absolute left-3 top-2.5 text-gray-400">🔍</span>
          </div>
          <button type="button" onclick="openUniversalQrScannerModal()" class="px-3.5 py-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white rounded-lg text-xs font-bold shadow flex items-center gap-1.5 transition active:scale-95" title="Scan Jewellery QR or Estimate Bill QR">
            <span class="text-sm">📷</span> <span>Scan QR</span>
          </button>
        </div>
        
        <div class="relative cursor-pointer" onclick="toggleNotifications()">
          <span class="text-xl">🔔</span>
        </div>
        
        <!-- Notifications Dropdown -->
        <div id="notifDropdown" class="hidden absolute top-16 right-6 w-80 bg-white border border-gray-200 rounded-lg shadow-xl z-50 max-h-96 overflow-y-auto">
          <div class="p-3 border-b border-gray-100 font-semibold text-sm">Notifications</div>
          <div id="notifList" class="p-2 space-y-1 text-sm">
            <div class="p-2 text-gray-500 text-center">No new notifications</div>
          </div>
        </div>
      </div>
    </header>

    <!-- Scrollable content area -->
    <div class="flex-1 overflow-y-auto p-6 bg-[#F9FAFB]" id="mainContent">
      <!-- Dynamic content injected here -->
    </div>
  </main>

  <!-- Toast Container -->
  <div id="toastContainer" class="fixed bottom-4 right-4 flex flex-col gap-2 z-50"></div>

  <script src="/js/app.js?v=1791808000000"></script>
  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('mobileOverlay');
      const isClosed = sidebar.classList.contains('-translate-x-full');
      
      if (isClosed) {
        sidebar.classList.remove('-translate-x-full');
        overlay.classList.remove('hidden');
        // Small delay for fade effect
        setTimeout(() => overlay.classList.remove('opacity-0'), 10);
      } else {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('opacity-0');
        setTimeout(() => overlay.classList.add('hidden'), 300);
      }
    }
    // Auto-close sidebar on mobile when navigating
    document.getElementById('sidebarNav').addEventListener('click', (e) => {
      if(e.target.closest('a') && window.innerWidth < 768) {
        toggleSidebar();
      }
    });
  </script>
</body>
</html>
